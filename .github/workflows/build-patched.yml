name: Build patched APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fork
      - uses: actions/checkout@v4
        with:
          repository: Flow-Tube/Flow
          ref: v3.0.5
          path: src
      - run: unzip -o fork/Flow-patch-v3.0.5.zip -d src
      - name: Build for arm64 phones only
        run: |
          sed -i 's/"armeabi-v7a", "arm64-v8a", "x86", "x86_64"/"arm64-v8a"/g' src/app/build.gradle.kts
          sed -i 's/isUniversalApk = true/isUniversalApk = false/' src/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleGithubDebug --no-daemon
        working-directory: src
      - name: Keep only the arm64 APK
        run: |
          mkdir out
          cp src/app/build/outputs/apk/github/debug/*arm64*.apk out/ || cp src/app/build/outputs/apk/github/debug/*.apk out/
      - uses: actions/upload-artifact@v4
        with:
          name: flow-debug-apk
          path: out/*.apk
          if-no-files-found: error
